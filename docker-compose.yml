version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# EduERP Development Stack
# Usage:
#   docker-compose up -d        → start postgres + server
#   docker-compose logs -f      → tail logs
#   docker-compose down -v      → stop and remove volumes
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 17 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: eduerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eduerp
      POSTGRES_USER: eduerp
      POSTGRES_PASSWORD: eduerp_dev_password   # Change in production!
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=nl_BE.UTF-8 --lc-ctype=nl_BE.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/internal/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduerp -d eduerp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── EduERP Go Server ───────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: eduerp-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://eduerp:eduerp_dev_password@postgres:5432/eduerp?sslmode=disable"
      JWT_SECRET: "dev-secret-change-before-production-use"
      # OAuth credentials — set via .env file or CI secrets
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      MICROSOFT_CLIENT_ID: "${MICROSOFT_CLIENT_ID:-}"
      MICROSOFT_CLIENT_SECRET: "${MICROSOFT_CLIENT_SECRET:-}"
      MICROSOFT_TENANT_ID: "${MICROSOFT_TENANT_ID:-}"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: eduerp-network
